[project]
name = "metadata-harvester"
version = "0.1.0"
description = "Repository for metadata crawlers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types>=0.7.0",
    "anyio>=4.12.1",
    "certifi>=2026.2.25",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "httpx-retries>=0.4.6",
    "idna>=3.11",
    "lxml>=6.0.2",
    "oaipmh-scythe>=0.14.0",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "typing-extensions>=4.15.0",
    "typing-inspection>=0.4.2",
]

[project.scripts]
metadata-harvester = "harvester.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harvester"]

[dependency-groups]
dev = [
    "lxml-stubs==0.5.1",
    "mypy>=2.3.0",
    "pytest",
]

[tool.mypy]
python_version = "3.12"
files = ["harvester"]
strict = true
enable_error_code = ["possibly-undefined", "truthy-bool"]
explicit_package_bases = true
namespace_packages = true
